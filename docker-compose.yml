services:
  postgres:
    image: postgres:16-alpine
    container_name: servis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: servis
      POSTGRES_USER: servis
      POSTGRES_PASSWORD: servis_dev_password
    ports:
      - "5432:5432"
    volumes:
      - servis_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U servis -d servis"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  servis_postgres_data:
